name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 in Oct 2026
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install ruff==0.17.0
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 in Oct 2026
    steps:
      - uses: actions/checkout@v7
      # Same Python and Java as the Spark image, so tests run on the
      # versions the pipeline actually uses.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  compose:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 in Oct 2026
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
